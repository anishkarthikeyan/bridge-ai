# Role directory — who can actually fill a required role, for the software industry pack.
#
# Read by RoleDirectoryLoader (app/domain/services/role_directory_loader.py) into an
# immutable, role-indexed mapping of CandidateContact. RoleResolver picks the best candidate
# for a role deterministically (lowest preference_rank, ties broken by name) — never an LLM
# call. Separate from policies/software.yaml: that file is topic policy, this file is people.
#
# preference_rank: lower is more preferred. Omit for 0 (highest); ties break by name.

