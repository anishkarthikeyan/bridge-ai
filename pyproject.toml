[project]
name = "bridge-ai"
version = "0.1.0"
description = "Bridge AI — an autonomous, multi-channel communication agent. Caspian Buildathon."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langgraph>=0.2",
    "langgraph-checkpoint>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "openai>=1.50",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # Real caspian-sdk (Phase 6.6) — consumed by app/integrations/real_caspian_client.py, via
    # app/infrastructure/di_container.py. Previously unavailable on PyPI (Phase 1-6.5); the
    # buildathon organizers have since published it.
    "caspian-sdk>=0.6.4",
]

[project.scripts]
bridge-ai = "app.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- ruff ------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# FastAPI's own DI pattern is `param: T = Depends(...)` / `= Query(...)` — bugbear's B008
# ("no function calls in argument defaults") is a real footgun in general but a false
# positive for these two, which FastAPI evaluates per-request, not once at import time.
# Added in Phase 6.5 alongside this codebase's first Depends()-based routes
# (app/integrations/api/routers/); nothing before that used FastAPI's DI at all.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

# --- mypy --------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# --- pytest ------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
