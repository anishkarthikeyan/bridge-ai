services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bridge_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bridge_ai}
      POSTGRES_DB: ${POSTGRES_DB:-bridge_ai}
    # Host-side port only — the `app` service below never uses this; it reaches this
    # container over the compose network as `db:5432` regardless of what's published here
    # (see `app.environment.DATABASE_URL`), so remapping the host port has zero effect on a
    # `docker compose up` deployment. It matters only for host tools (native `psql`, a
    # locally-run `uv run bridge-ai`) hitting `localhost:5432` directly. Local dev on this
    # machine already runs a native Homebrew PostgreSQL@16 bound to `localhost:5432` — two
    # servers cannot both truly own that port, and diagnosis found the native one silently
    # winning every real connection (more specific bind beats this container's wildcard
    # bind), leaving this container's database permanently empty/unmigrated. Native Postgres
    # is authoritative for local dev (it holds the real data); this is published on a
    # different host port so `docker compose up` never contends for 5432 again. Override
    # with POSTGRES_HOST_PORT if 5433 is also taken.
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bridge_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env's DATABASE_URL so the app always reaches the compose network's
      # "db" service, regardless of what a local .env points at.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bridge_ai}:${POSTGRES_PASSWORD:-bridge_ai}@db:5432/${POSTGRES_DB:-bridge_ai}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
